name: Share-Ed Load Test

on:
  # ทุก push เข้า main จะรันเพียง Smoke Test เพื่อไม่ให้ production ถูกโหลดหนักโดยอัตโนมัติ
  push:
    branches: [main]
    paths:
      - '**.js'
      - '.github/workflows/load-test.yml'

  # ใช้ปุ่ม Run workflow เพื่อเลือกชุดทดสอบด้วยตนเอง
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'เลือกชุดทดสอบ'
        required: true
        default: smoke
        type: choice
        options: [smoke, diagnostic, load20, capacity, authenticated]
      max_vus:
        description: 'ใช้เมื่อเลือก capacity: 20, 50 หรือ 100'
        required: true
        default: '20'
        type: choice
        options: ['20', '50', '100']

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_PROFILE: ${{ inputs.test_profile || 'smoke' }}
      MAX_VUS: ${{ inputs.max_vus || '20' }}
      # เก็บข้อมูลบัญชีทดสอบและ Webhook ไว้ใน GitHub Secrets เท่านั้น
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: ดาวน์โหลดไฟล์จาก repository
        uses: actions/checkout@v4

      - name: เตรียมโฟลเดอร์ผลทดสอบ
        run: mkdir -p results

      - name: รัน k6 ตามชุดทดสอบที่เลือก
        id: k6
        continue-on-error: true
        run: |
          case "$TEST_PROFILE" in
            smoke)
              docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work grafana/k6:1.7.1 run smoke-test.js
              ;;
            diagnostic)
              docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work grafana/k6:1.7.1 run diagnostic-test.js
              ;;
            load20)
              docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work grafana/k6:1.7.1 run load-test.js
              ;;
            capacity)
              docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work grafana/k6:1.7.1 run -e MAX_VUS="$MAX_VUS" capacity-test.js
              ;;
            authenticated)
              # ทดสอบ Login -> ข้อมูลผู้ใช้ -> รายการโพสต์ -> รายละเอียดโพสต์ แบบอ่านอย่างเดียว
              docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
                -e EMAIL="$TEST_EMAIL" \
                -e PASSWORD="$TEST_PASSWORD" \
                -e SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
                grafana/k6:1.7.1 run authenticated-smoke.js
              ;;
            *)
              echo "ไม่รู้จักชุดทดสอบ: $TEST_PROFILE"
              exit 2
              ;;
          esac

      - name: สร้างข้อความรายงานสำหรับ Discord
        if: always()
        env:
          WORKFLOW_STATUS: ${{ steps.k6.outcome }}
        run: node ci/build-discord-report.mjs

      - name: ส่งรายงานเข้า Discord
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl --fail --request POST "$DISCORD_WEBHOOK_URL" --header 'Content-Type: application/json' --data @results/discord-payload.json

      - name: เก็บผลทดสอบเป็นไฟล์ดาวน์โหลด
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

      # ให้ workflow เป็นสีแดงเมื่อ k6 ไม่ผ่าน แม้จะส่งรายงานและเก็บ artifact เรียบร้อยแล้ว
      - name: จบงานตามผล k6
        if: steps.k6.outcome != 'success'
        run: exit 1
